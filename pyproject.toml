[project]
name = "smeltery"
dynamic = ["version"]
description = "A tiered, measurement-disciplined funnel for biochemical systems, over ferric."
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Matthew Goldey" }]
keywords = ["computational-chemistry", "drug-discovery", "quantum-chemistry", "virtual-screening"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.11,<3.13"
dependencies = [
    # ferric publishes only pre-releases so far; the explicit pre-release floor
    # lets pip select them. The wheel is what a plain install and `uv sync` both
    # get; [tool.uv.sources] below says how to point at a checkout instead.
    "ferric>=0.1.0rc10",
    "rdkit>=2024.3",
    "numpy>=1.26",
    # Core, not a `gui`/`bench` extra: `smeltery run --out` stages the config's input files, which rewrites
    # their paths while keeping the config's comments. tomllib only reads, so staging needs tomlkit.
    "tomlkit>=0.13",
]

[project.scripts]
smeltery = "smeltery.cli:main"

# Reference providers, registered the way a third party registers its own (docs/providers.md).
# Entry name is "<kind>:<name>"; the value is a factory (class or callable), imported only on request.
[project.entry-points."smeltery.providers"]
"structure:pdb" = "smeltery.providers.structure:PdbProvider"
"structure:afdb" = "smeltery.providers.structure:AfdbProvider"
"structure:boltz2" = "smeltery.providers.boltz:BoltzProvider"
"property:rdkit-alerts" = "smeltery.properties:RdkitAlertProvider"
"scoring:vina-score" = "smeltery.scoring:VinaScoreProvider"
"docking:vina" = "smeltery.docking.provider:VinaProvider"

[project.urls]
Homepage = "https://github.com/mgoldey/smeltery"
Repository = "https://github.com/mgoldey/smeltery"
Issues = "https://github.com/mgoldey/smeltery/issues"

[project.optional-dependencies]
# ruff is pinned EXACTLY, and must equal the pin in .github/workflows/test.yml
# (tests/test_ruff_pin.py enforces it): a drifting linter moves the baseline.
# httpx2: starlette's TestClient, which the Bench API tests use (httpx is deprecated there).
dev = ["pytest>=8", "pytest-cov>=7", "ruff==0.16.10", "httpx2>=2.13"]
# Optional readers for smeltery.structure. A missing one raises MissingBackend
# naming the extra. gemmi is currently also pulled in by ferric itself; rdkit is
# also a core dependency while smeltery.tiers imports it at module level.
gemmi = ["gemmi"]
rdkit = ["rdkit>=2024.3"]
# Vina search + Meeko ligand/receptor prep for smeltery.docking. An extra, not a
# core dependency: PyPI's vina ships wheels for CPython 3.8-3.12 only and builds
# from source (needing Boost) elsewhere. rdkit, scipy and gemmi are listed
# because meeko 0.8.0 declares no dependencies yet imports all three.
# PoseBusters validity gate (smeltery.gates.posebusters_check).
posebusters = ["posebusters>=0.4", "rdkit>=2024.3"]
docking = ["vina>=1.2.7", "meeko>=0.8.0", "rdkit>=2024.3", "scipy>=1.11", "gemmi"]
# ML-potential tier (smeltery.providers.openmm_ml): ANI-2x through OpenMM-ML. Minimums are the versions
# measured in docs/potentials.md (openmm 8.6.1, openmmml 1.8, torchani 2.9.0); torchani 2.9.0 pins torch<=2.13.
# openmmml's FORCE_SCALE correction is verified for 1.8 only. Pulls torch (~GBs): never part of CI's extras.
ml-potential = ["openmm>=8.6.1", "openmmml>=1.8", "torchani>=2.9.0", "torch>=2.0,<=2.13", "numpy"]
# smeltery.providers.aimnet2 only (docs/benchmarks/aimnet2_anion.md). Separate from `ml-potential` so CI's resolve of
# that extra does not pull aimnet's warp-lang/nvalchemi stack; aimnet needs torch>=2.8 and Python>=3.11.
aimnet2 = ["aimnet>=0.2.0", "torch>=2.8", "numpy"]
# Third-party imports of the frozen ferric code under experiments/ (psutil: binding_energy's memory check;
# scipy: the run_* scripts). Not core: nothing under src/smeltery imports them.
experiments = ["psutil>=5.9", "scipy>=1.11"]
# The GUI (smeltery.gui.app, docs/gui.md): the Marimo app and its views. Only smeltery.gui.views imports these, and
# only inside functions, so `import smeltery.gui` works without the extra. mols2grid needs pandas and pulls it in.
gui = ["marimo>=0.25", "anywidget>=0.11", "mols2grid>=2.2", "molviewspec>=1.8", "plotly>=6", "tomlkit>=0.13"]
# `smeltery bench` (smeltery.bench): the API and the built React app (ui/, built into src/smeltery/bench/web/ and
# shipped in the wheel). plotly and molviewspec are here, not only in `gui`, because the API serves the figures
# and pose scenes smeltery.gui builds, and those import them lazily: without them the app starts and then fails
# on the first plot.
bench = ["fastapi>=0.120", "uvicorn>=0.38", "plotly>=6", "molviewspec>=1.8", "tomlkit>=0.13"]
# `smeltery gui OUT --desktop`: the same app in a pywebview window instead of a browser tab.
desktop = ["pywebview>=5", "marimo>=0.25", "anywidget>=0.11", "mols2grid>=2.2", "molviewspec>=1.8", "plotly>=6"]
# scripts/plb_pocket_charges.py only (force-field charges for a PLB protein, docs/benchmarks/plb_plan.md). One-off tool
# dependency: nothing under src/smeltery imports it; tests that need it skip without it.
pocket-charges = ["openmm>=8.6.1"]
# `smeltery.tasks` (the task layer behind `smeltery task-worker` and the dashboard's task panel) and
# scripts/temporal_ddE.py (durable orchestration of a tier over a study's cells, with retries,
# timeouts and heartbeats on steps that run for hours). Needs a Temporal server to talk to, which is
# NOT a Python dependency: `docker run temporalio/temporal:latest server start-dev`. Imported lazily
# and guarded by `TEMPORAL_AVAILABLE`, so core smeltery works without it; task operations then raise
# `TemporalUnavailable` rather than falling back to a private implementation.
temporal = ["temporalio>=1.35"]
# scripts/plb_pocket_charges.py --prep only (repair an unprepped crystal pocket before typing: missing side-chain
# heavy atoms, a missing chain-terminal atom, absent hydrogens). pdbfixer is from the OpenMM project, pure Python,
# and needs only numpy and openmm, so this extra adds no new stack. openmm.app.Modeller cannot add missing HEAVY
# atoms, which is why this is a separate tool and not a few lines. Nothing under src/smeltery imports it.
pocket-prep = ["openmm>=8.6.1", "pdbfixer>=1.12"]

[tool.uv.sources]
# ferric comes from its PyPI wheel (the floor above), so `uv sync` / `uv run` never compile Rust or libint2.
# The run record still gets VERIFIED provenance: an index release is immutable (smeltery/record.py).
# A git source here would make uv BUILD ferric just to read its metadata whenever it re-locks.
# To develop against an unreleased ferric, use a local checkout (needs Rust, libint2, OpenBLAS):
#   ferric = { path = "../ferric" }
# or an exact commit (the record reports the SHA from direct_url.json):
#   ferric = { git = "https://github.com/mgoldey/ferric", rev = "<sha>" }

[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

# The version is the git tag (v0.0.2 -> 0.0.2); untagged builds get
# .devN+g<sha>, which PyPI rejects, so a misfire cannot publish.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/smeltery"]
# The built Bench UI is gitignored (it is build output), and hatch leaves ignored files out by default; `artifacts`
# puts it back. CI and release run `npm run build` in ui/ before building the wheel.
artifacts = ["src/smeltery/bench/web/**", "src/smeltery/prebuilt/**", "!src/smeltery/prebuilt/**/run/temporal/**"]
# `artifacts` re-includes even gitignored files, and wins over `exclude` (measured: exclude alone still shipped a dummy
# run/temporal/x.json), so a pipeline's local temporal/ scratch is dropped by the "!" artifact pattern; `exclude` is kept
# so the intent also reads from the target.
exclude = ["**/run/temporal/**"]

# The SAME artifacts, because `python -m build` (what release.yml runs) builds the sdist first and then the wheel
# FROM that sdist: anything the sdist drops is missing from the wheel too. Declaring these only on the wheel target
# is what published nothing for v0.1.0 -- the sdist carried 0 of the 59 bench/web files, so the wheel built from it
# failed the bench extra's own `index.html` check. tests/test_wheel_smoke.py keeps the two lists equal.
[tool.hatch.build.targets.sdist]
artifacts = ["src/smeltery/bench/web/**", "src/smeltery/prebuilt/**", "!src/smeltery/prebuilt/**/run/temporal/**"]
exclude = ["**/run/temporal/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root is on sys.path so `experiments.danuglipron...` imports resolve (no packages needed).
# experiments/ is run as its own `pytest experiments` (a separate CI step): its test files share basenames with
# tests/ (test_funnel.py, ...), so one combined run would collide.
pythonpath = ["."]
markers = [
    "needs_ferric: needs the real ferric engine; skipped only under SMELTERY_NO_FERRIC=1 (scripts/dev-check.sh)",
    "gpu: needs the external DiffSBDD environment and a GPU; skipped unless SMELTERY_SBDD_PYTHON, SMELTERY_SBDD_DIR, SMELTERY_SBDD_CKPT and SMELTERY_SBDD_POCKET are set",
]

[tool.ruff]
line-length = 120
# experiments/ is a frozen record of ferric code, moved unmodified except for mechanical import and path
# rewrites (experiments/README.md); restyling it would defeat that. docs/archive/ is ferric's site pages,
# kept verbatim (this ruff also formats fenced code in .md files).
extend-exclude = ["experiments", "docs/archive"]
target-version = "py311"

[tool.ruff.lint]
# Deliberately conservative: pycodestyle errors, pyflakes, isort, bugbear.
select = ["E", "F", "I", "B"]
# B905 (zip strict=) would change runtime behaviour at 35 sites; not a style fix.
ignore = ["B905"]

# `ty` (Astral), same toolchain as ruff and uv. Run with `uvx ty@0.0.96 check` -- pinned, because ty is pre-1.0
# and a bump must be a decision rather than a surprise. It is NOT a runtime or dev dependency: nothing imports it.
#
# Scope is deliberate. `src/smeltery/bench/` is checked as a required gate, because a ports-and-adapters layer is
# only worth building if its signatures are enforced; an unchecked contract is a comment. The rest of the repo is
# checked advisory-only (a non-blocking CI job), so drift stays visible without a pre-1.0 tool being able to break
# main. Widen `include` when ty reaches 1.0 or the advisory job is near-clean.
#
# It paid for itself on arrival: of 11 diagnostics across the GUI and task modules, two were real bugs in
# `tasks.py` -- a return annotation that resolved to a shadowing method instead of `list`, and an import guard
# assigning None over a function. Both are fixed.
[tool.ty]

[tool.ty.src]
include = ["src/smeltery/bench"]
