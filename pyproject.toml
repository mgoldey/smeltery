[project]
name = "smeltery"
dynamic = ["version"]
description = "A tiered, measurement-disciplined funnel for biochemical systems, over ferric."
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Matthew Goldey" }]
keywords = ["computational-chemistry", "drug-discovery", "quantum-chemistry", "virtual-screening"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.11,<3.13"
dependencies = [
    # ferric publishes only pre-releases so far; the explicit pre-release floor
    # lets pip select them. For development, [tool.uv.sources] below pins an
    # exact ferric commit instead.
    "ferric>=0.1.0rc6",
    "rdkit>=2024.3",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/mgoldey/smeltery"
Repository = "https://github.com/mgoldey/smeltery"
Issues = "https://github.com/mgoldey/smeltery/issues"

[project.optional-dependencies]
# ruff is pinned EXACTLY, and must equal the pin in .github/workflows/test.yml
# (tests/test_ruff_pin.py enforces it): a drifting linter moves the baseline.
dev = ["pytest>=8", "ruff==0.16.10"]
# Optional readers for smeltery.structure. A missing one raises MissingBackend
# naming the extra. gemmi is currently also pulled in by ferric itself; rdkit is
# also a core dependency while smeltery.tiers imports it at module level.
gemmi = ["gemmi"]
rdkit = ["rdkit>=2024.3"]
# Vina search + Meeko ligand/receptor prep for smeltery.docking. An extra, not a
# core dependency: PyPI's vina ships wheels for CPython 3.8-3.12 only and builds
# from source (needing Boost) elsewhere. rdkit, scipy and gemmi are listed
# because meeko 0.8.0 declares no dependencies yet imports all three.
docking = ["vina>=1.2.7", "meeko>=0.8.0", "rdkit>=2024.3", "scipy>=1.11", "gemmi"]

[tool.uv.sources]
# An exact commit, not a branch: the run record reports this SHA, read back
# from the installed package's metadata. To develop against a local ferric
# checkout instead, point this at it: ferric = { path = "../ferric" }
ferric = { git = "https://github.com/mgoldey/ferric", rev = "8637a5d50b8f0a5ea1953159ac5c775d9e2009ff" }

[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

# The version is the git tag (v0.0.2 -> 0.0.2); untagged builds get
# .devN+g<sha>, which PyPI rejects, so a misfire cannot publish.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/smeltery"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Deliberately conservative: pycodestyle errors, pyflakes, isort, bugbear.
select = ["E", "F", "I", "B"]
# B905 (zip strict=) would change runtime behaviour at 35 sites; not a style fix.
ignore = ["B905"]
