[project]
name = "smeltery"
version = "0.0.1"
description = "A tiered, measurement-disciplined funnel for biochemical systems, over ferric."
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Matthew Goldey" }]
keywords = ["computational-chemistry", "drug-discovery", "quantum-chemistry", "virtual-screening"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.11,<3.13"
dependencies = [
    # ferric publishes only pre-releases so far; the explicit pre-release floor
    # lets pip select them. For development, [tool.uv.sources] below pins an
    # exact ferric commit instead.
    "ferric>=0.1.0rc6",
    "rdkit>=2024.3",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/mgoldey/smeltery"
Repository = "https://github.com/mgoldey/smeltery"
Issues = "https://github.com/mgoldey/smeltery/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv.sources]
# An exact commit, not a branch: the run record reports this SHA, read back
# from the installed package's metadata. To develop against a local ferric
# checkout instead, point this at it: ferric = { path = "../ferric" }
ferric = { git = "https://github.com/mgoldey/ferric", rev = "8637a5d50b8f0a5ea1953159ac5c775d9e2009ff" }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smeltery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
