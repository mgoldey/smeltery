[package]
name = "smeltery-bench-app"
version = "0.1.0"
description = "Bench as a desktop window: a Tauri shell that owns a local smeltery bench server"
authors = ["Matthew Goldey"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The server is a child process, not a bundled binary, so no sidecar/shell plugin is needed:
# std::process is enough and keeps the permission surface empty.

[features]
# Tauri's own default: production builds get no devtools.
default = []
