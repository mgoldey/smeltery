# Test the tree on every push and PR to main, so a broken anchor cannot reach
# main unnoticed.
#
# ferric is installed from its PyPI wheel (`--no-sources` ignores the git pin in
# [tool.uv.sources]): building ferric from source needs libint2, which the
# runner does not have. This is the same ferric a user gets from
# `pip install smeltery`. `uv run --no-sync` keeps uv from re-resolving
# against the git pin afterwards.
#
# Actions are pinned by commit SHA, in the style of release.yml.
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # ferric's convention: no oversubscribed BLAS threads in tests.
  OPENBLAS_NUM_THREADS: "1"
  # Exact ruff pin; must equal the ruff== pin in pyproject.toml's dev extras
  # (tests/test_ruff_pin.py fails if they disagree). The lint step also checks
  # the installed version against it.
  RUFF_VERSION: "0.16.10"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install (ferric from PyPI)
        run: uv sync --extra dev --extra posebusters --extra experiments --extra bench --no-sources
      # The danuglipron-halogen prebuilt reads a .pdb pocket, so planning it needs pdb2pqr30 to assign the
      # charges. 3.8.0 is the version the committed records were made with, which the digest guards expect.
      - name: Install pdb2pqr30 (a .pdb pocket's charges come from it)
        run: uv pip install pdb2pqr

      - name: Lint (ruff check)
        run: |
          uv run --no-sync ruff --version | grep -qx "ruff $RUFF_VERSION"
          uv run --no-sync ruff check .

      - name: Format (ruff format --check)
        run: uv run --no-sync ruff format --check .

      - name: Tests
        run: uv run --no-sync pytest -q

      - name: Frozen campaign record (experiments/)
        run: uv run --no-sync pytest -q experiments

      - name: Example (benzoic acid)
        run: uv run --no-sync python examples/mwe_benzoic.py

  # The Bench gate on its own, so a Bench regression is reported in minutes instead of at the end of the ~30-minute
  # `test` job (which still runs these tests too). It runs on 3.11 and 3.12: the classifiers claim both, but every
  # other job here is 3.11 only and posebusters-py312 covers one test file. Coverage of smeltery.bench is measured
  # and floored at 87% (measured 88.9% with exactly this install, rounded down); raise the floor when
  # coverage rises, never lower it to make a PR pass. The path form of --cov is deliberate: --cov=smeltery.bench
  # imports the package before numpy and dies with "cannot load module more than once per process".
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false   # a 3.12-only failure must not hide the 3.11 result
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install (dev + bench extras, ferric from PyPI)
        run: uv sync --extra dev --extra bench --no-sources
      - name: Install pdb2pqr30 (the active-site preview charges a PDB with it)
        run: uv pip install pdb2pqr
      - name: Bench gate with coverage
        run: >
          uv run --no-sync pytest tests/bench tests/test_study_plan_cells.py -q -p no:randomly
          --cov=src/smeltery/bench --cov-report=term-missing --cov-fail-under=87

  ty:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # uv sync builds the project; hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the dependencies ty resolves imports against
        # ty reads .venv; without the bench and rdkit extras every fastapi/rdkit import is unresolved
        run: uv sync --extra dev --extra bench --extra rdkit --no-sources
      - name: Type check (required)
        run: uvx ty@0.0.96 check

  ty-repo-wide:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # uv sync builds the project; hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the dependencies ty resolves imports against
        # ty reads .venv; without the bench and rdkit extras every fastapi/rdkit import is unresolved
        run: uv sync --extra dev --extra bench --extra rdkit --no-sources
      - name: Type check (repo-wide, non-blocking)
        # Explicit paths, so this does not inherit [tool.ty.src] include (src/smeltery/bench only).
        run: uvx ty@0.0.96 check src tests

  # The Bench UI (ui/): typecheck, unit tests, generated API types up to date, and every page in a real browser
  # against the real API over fixture runs. Offline: the e2e fixture fails any request to a non-local host.
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install (dev + bench extras, ferric from PyPI)
        run: uv sync --extra dev --extra bench --no-sources
      - name: Install pdb2pqr30 (the active-site preview charges a PDB with it)
        run: uv pip install pdb2pqr
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci --prefix ui
      - name: Typecheck (app, tests and e2e)
        run: npm run typecheck --prefix ui
      - name: Unit tests
        run: npm run test --prefix ui
      - name: Generated API types match the API
        env:
          BENCH_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          npm run gen:api --prefix ui
          git diff --exit-code ui/src/api/schema.d.ts
      - name: Browser
        run: npx --prefix ui playwright install --with-deps chromium
      - name: Every page in a real browser
        env:
          BENCH_PYTHON: ${{ github.workspace }}/.venv/bin/python
        working-directory: ui
        run: npx playwright test

  # ESLint for the Bench UI. Its own job and not a step of `ui`, so a first red run is visible and fixable without
  # blocking the typecheck, unit and browser results. Not a required check until it has been green once on main.
  ui-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci --prefix ui
      - name: Lint (eslint)
        run: npm run lint --prefix ui

  # Real Vina + Meeko docking. The `test` job above has no `docking` extra, so
  # every test that needs vina/meeko skips there; this job installs the extra
  # and fails if any docking test still skips for a missing module. Vina ships
  # wheels for CPython <= 3.12 only, hence 3.11.
  docking:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install (dev + docking + posebusters extras, ferric from PyPI)
        run: uv sync --extra dev --extra docking --extra posebusters --no-sources

      - name: Install pdb2pqr30 (pocket files in the docking tests are PDBs)
        run: uv pip install pdb2pqr

      - name: Docking tests (real Vina + Meeko)
        run: |
          set -o pipefail
          uv run --no-sync pytest -q -rs tests/test_docking_*.py | tee /tmp/docking.txt
          if grep -iE '^SKIPPED.*(vina|meeko|rdkit|docking extra|pdb2pqr)' /tmp/docking.txt; then
            echo "::error::a docking test skipped for a missing vina/meeko/rdkit/pdb2pqr30; the docking job install is not effective"
            exit 1
          fi

  # The ml-potential tests need torch, so the `test` job skips them. This job installs the extra (CPU torch, which
  # keeps the download small) and fails if any of them still skips for a missing module (issue #22).
  ml-potential:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_TORCH_BACKEND: cpu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install (dev + ml-potential extras, ferric from PyPI)
        run: uv sync --extra dev --extra ml-potential --no-sources

      - name: ML potential tests (real ANI-2x)
        run: |
          set -o pipefail
          uv run --no-sync pytest -q -rs tests/test_ml_potential.py tests/test_torchani_potential.py | tee /tmp/ml.txt
          if grep -iE '^SKIPPED.*(ml-potential|openmm|torch)' /tmp/ml.txt; then
            echo "::error::an ml-potential test skipped for a missing module; the job install is not effective"
            exit 1
          fi

  # The BUILT wheel installed with plain pip into a fresh venv, with and without each extra the wheel declares
  # (issue #31). The matrix comes from the wheel's own metadata, so a new extra is covered the moment it exists;
  # scripts/wheel_smoke.py refuses an extra it has no checks for, and tests/test_wheel_smoke.py guards the same.
  wheel-build:
    runs-on: ubuntu-24.04
    outputs:
      extras: ${{ steps.extras.outputs.extras }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # hatch-vcs derives the version from tags
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the Bench UI (shipped in the wheel; src/smeltery/bench/web is gitignored build output)
        run: |
          npm ci --prefix ui
          npm run build --prefix ui
      # Plain `python -m build`, the SAME command release.yml runs, not `--wheel`: it builds the sdist first and the
      # wheel FROM that sdist, so an artifact the sdist drops is missing from the wheel. Building only the wheel here
      # meant that difference went untested until a tag, and v0.1.0 published nothing because of it (the sdist had 0
      # of the 59 bench/web files). Keep these two commands identical so the release path is exercised on every PR.
      - name: Build the sdist and the wheel (the release path)
        run: |
          python -m pip install --upgrade build
          python -m build
      - id: extras
        run: echo "extras=$(python scripts/wheel_smoke.py list-extras dist/*.whl)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel
          path: dist/
          if-no-files-found: error

  wheel-smoke:
    needs: wheel-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        extra: ${{ fromJSON(needs.wheel-build.outputs.extras) }}
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheel
          path: dist/
      - name: Wheel with extra "${{ matrix.extra }}"
        run: python scripts/wheel_smoke.py check dist/*.whl --extra "${{ matrix.extra }}" --config examples/mwe_benzoic.toml
      - name: The example runs from the installed wheel, and the run record's ferric provenance is VERIFIED
        if: matrix.extra == 'none'
        run: python scripts/wheel_smoke.py check dist/*.whl --extra none --example examples/mwe_benzoic.py

  # The PoseBusters gate on Python 3.12 (issue #68). The `test` job runs 3.11
  # only, which hid a segfault in posebusters_check on uv's CPython 3.12.11+
  # (numpy iterating RDKit Point3D -> C++ throw -> boost stacktrace hook ->
  # _Unwind_Backtrace). gates.py works around it; this job fails if that
  # regresses. Not continue-on-error: the workaround is verified.
  posebusters-py312:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install (dev + posebusters extras, ferric from PyPI)
        run: uv sync --extra dev --extra posebusters --no-sources

      - name: PoseBusters tests on 3.12
        run: uv run --no-sync pytest -q tests/test_posebusters_gate.py

  # The Docker image serves the demo (issue B08). Builds the image (which builds the UI itself: src/smeltery/bench/web
  # is gitignored), runs it with a known token, waits for the container's own healthcheck, then asserts that /readyz
  # is 200 and /api/runs is non-empty, which only holds if the pip install, the prebuilt pipelines and --demo all
  # worked. Also asserts that an unauthenticated /api/runs is refused (the token is enforced off loopback).
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOKEN: ci-docker-token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the image
        run: docker build --tag smeltery-bench:ci .
      - name: Run it (the demo)
        run: >
          docker run --detach --name bench --publish 127.0.0.1:8765:8765
          --env SMELTERY_BENCH_TOKEN="$TOKEN" smeltery-bench:ci
      - name: Wait for the healthcheck
        run: |
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' bench)"
            [ "$status" = healthy ] && exit 0
            [ "$(docker inspect --format '{{.State.Running}}' bench)" = true ] || break
            sleep 2
          done
          echo "::error::the container never became healthy (last status: $status)"
          exit 1
      - name: /readyz is 200 and /api/runs is non-empty
        run: |
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8765/readyz
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8765/api/runs)"
          [ "$code" = 401 ] || { echo "::error::/api/runs without the token returned $code, expected 401"; exit 1; }
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8765/api/runs > runs.json
          python3 - <<'PY'
          import json
          runs = json.load(open("runs.json"))
          runs = runs.get("runs", runs) if isinstance(runs, dict) else runs
          assert runs, "/api/runs is empty: the demo was not seeded"
          print(len(runs), "runs")
          PY
      - name: Container logs
        if: always()
        run: docker logs bench || true
