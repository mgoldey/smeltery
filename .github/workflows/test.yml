# Test the tree on every push and PR to main, so a broken anchor cannot reach
# main unnoticed.
#
# ferric is installed from its PyPI wheel (`--no-sources` ignores the git pin in
# [tool.uv.sources]): building ferric from source needs libint2, which the
# runner does not have. This is the same ferric a user gets from
# `pip install smeltery`. `uv run --no-sync` keeps uv from re-resolving
# against the git pin afterwards.
#
# Actions are pinned by commit SHA, in the style of release.yml.
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # ferric's convention: no oversubscribed BLAS threads in tests.
  OPENBLAS_NUM_THREADS: "1"
  # Exact ruff pin; must equal the ruff== pin in pyproject.toml's dev extras
  # (tests/test_ruff_pin.py fails if they disagree). The lint step also checks
  # the installed version against it.
  RUFF_VERSION: "0.16.10"

jobs:
  # The local gate (.pre-commit-config.yaml) run as-is, so what a contributor's hooks check and what CI checks cannot
  # drift. Hooks only (the default stage): the pytest hook is pre-push and is the `test` job below.
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # uv sync builds the project; hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # The ty hook resolves imports against .venv, like the `ty` job.
      - name: Install (what the hooks and ty resolve against)
        run: uv sync --extra dev --extra bench --extra rdkit --no-sources
      - name: pre-commit run --all-files
        run: uv run --no-sync pre-commit run --all-files

  # Python 3.11 and 3.12: the classifiers claim both. fail-fast is off so a 3.12-only failure does not hide the 3.11
  # result. The two legs run in parallel, so wall time stays that of one leg (~30 min); the cost is doubled runner
  # minutes.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `dataset` (pyarrow): without it every Parquet/Arrow test in tests/test_dataset_*.py skipped here. The dataset
      # DIRECTORY tests (tests/test_dataset_record.py) also need attestation-schema with attestation.dataset/1
      # (>= smeltery.dataset_record.REQUIRED_SCHEMA); they skip until the `attestation` extra's floor reaches that
      # release, and from then on a test there fails instead of letting them skip.
      - name: Install (ferric from PyPI)
        run: uv sync --extra dev --extra posebusters --extra experiments --extra bench --extra attestation --extra dataset --no-sources
      # attestation-schema 0.1.0 comes from PyPI through the `attestation` extra above, so the core run record tests
      # run on 3.11 too; fail loudly if it did not install rather than letting tests/test_core_record.py skip.
      - name: Check attestation-schema is installed
        run: uv run --no-sync python -c "from smeltery import core_record as c; assert c.AVAILABLE, c.NOT_INSTALLED"
      # The danuglipron-halogen prebuilt reads a .pdb pocket, so planning it needs pdb2pqr30 to assign the
      # charges. 3.8.0 is the version the committed records were made with, which the digest guards expect.
      - name: Install pdb2pqr30 (a .pdb pocket's charges come from it)
        run: uv pip install pdb2pqr

      - name: Lint (ruff check)
        run: |
          uv run --no-sync ruff --version | grep -qx "ruff $RUFF_VERSION"
          uv run --no-sync ruff check .

      - name: Format (ruff format --check)
        run: uv run --no-sync ruff format --check .

      - name: Tests
        run: uv run --no-sync pytest -q

      - name: Frozen campaign record (experiments/)
        run: uv run --no-sync pytest -q experiments

      - name: Example (benzoic acid)
        run: uv run --no-sync python examples/mwe_benzoic.py

  # The Bench gate on its own, so a Bench regression is reported in minutes instead of at the end of the ~30-minute
  # `test` job (which still runs these tests too). It runs on 3.11 and 3.12: the classifiers claim both, but every
  # other job here is 3.11 only and posebusters-py312 covers one test file. Coverage of smeltery.bench is measured
  # and floored at 87% (measured 88.9% with exactly this install, rounded down); raise the floor when
  # coverage rises, never lower it to make a PR pass. The path form of --cov is deliberate: --cov=smeltery.bench
  # imports the package before numpy and dies with "cannot load module more than once per process".
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false   # a 3.12-only failure must not hide the 3.11 result
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install (dev + bench extras, ferric from PyPI)
        run: uv sync --extra dev --extra bench --no-sources
      - name: Install pdb2pqr30 (the active-site preview charges a PDB with it)
        run: uv pip install pdb2pqr
      - name: Bench gate with coverage
        run: >
          uv run --no-sync pytest tests/bench tests/test_study_plan_cells.py -q -p no:randomly
          --cov=src/smeltery/bench --cov-report=term-missing --cov-fail-under=87

  ty:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # uv sync builds the project; hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the dependencies ty resolves imports against
        # ty reads .venv; without the bench and rdkit extras every fastapi/rdkit import is unresolved
        run: uv sync --extra dev --extra bench --extra rdkit --no-sources
      - name: Type check (required)
        run: uvx ty@0.0.96 check

  ty-repo-wide:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # uv sync builds the project; hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the dependencies ty resolves imports against
        # ty reads .venv; without the bench and rdkit extras every fastapi/rdkit import is unresolved
        run: uv sync --extra dev --extra bench --extra rdkit --no-sources
      - name: Type check (repo-wide, non-blocking)
        # Explicit paths, so this does not inherit [tool.ty.src] include (src/smeltery/bench only).
        run: uvx ty@0.0.96 check src tests

  # The Bench UI (ui/): typecheck, unit tests, generated API types up to date, and every page in a real browser
  # against the real API over fixture runs. Offline: the e2e fixture fails any request to a non-local host.
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install (dev + bench extras, ferric from PyPI)
        run: uv sync --extra dev --extra bench --no-sources
      - name: Install pdb2pqr30 (the active-site preview charges a PDB with it)
        run: uv pip install pdb2pqr
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci --prefix ui
      - name: Typecheck (app, tests and e2e)
        run: npm run typecheck --prefix ui
      - name: Unit tests
        run: npm run test --prefix ui
      - name: Generated API types match the API
        env:
          BENCH_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          npm run gen:api --prefix ui
          git diff --exit-code ui/src/api/schema.d.ts
      - name: Browser
        run: npx --prefix ui playwright install --with-deps chromium
      - name: Every page in a real browser
        env:
          BENCH_PYTHON: ${{ github.workspace }}/.venv/bin/python
        working-directory: ui
        run: npx playwright test

  # ESLint for the Bench UI. Its own job and not a step of `ui`, so a lint failure is legible without hiding the
  # typecheck, unit and browser results. Verified clean on this tree (0 errors, 0 warnings) by installing the lint
  # packages into a scratch copy -- they are declared in ui/package.json but absent from the dev machine's shared
  # node_modules, which is why B17 could not run it. --max-warnings 0 keeps it that way.
  ui-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci --prefix ui
      - name: Lint (eslint)
        run: npm run lint --prefix ui -- --max-warnings 0

  # Real Vina + Meeko docking. The `test` job above has no `docking` extra, so
  # every test that needs vina/meeko skips there; this job installs the extra
  # and fails if any docking test still skips for a missing module. Vina ships
  # wheels for CPython <= 3.12 only, hence 3.11.
  docking:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install (dev + docking + posebusters extras, ferric from PyPI)
        run: uv sync --extra dev --extra docking --extra posebusters --no-sources

      - name: Install pdb2pqr30 (pocket files in the docking tests are PDBs)
        run: uv pip install pdb2pqr

      - name: Docking tests (real Vina + Meeko)
        run: |
          set -o pipefail
          uv run --no-sync pytest -q -rs tests/test_docking_*.py | tee /tmp/docking.txt
          if grep -iE '^SKIPPED.*(vina|meeko|rdkit|docking extra|pdb2pqr)' /tmp/docking.txt; then
            echo "::error::a docking test skipped for a missing vina/meeko/rdkit/pdb2pqr30; the docking job install is not effective"
            exit 1
          fi

  # The Temporal workflow tests: tests/test_temporal_campaign.py (one activity per stage, heartbeats, retries,
  # cancellation, the record on disk), tests/test_temporal_run.py and the temporal leg of tests/test_job_backends.py.
  # The `test` job has no `temporal` extra and no server, so they skip there. Here the test process starts the Temporal
  # dev server itself (tests/temporal_server.py: WorkflowEnvironment.start_local(), downloaded on first use), and
  # SMELTERY_TEST_TEMPORAL_REQUIRE=1 turns a missing server into a failure, so the job cannot pass by skipping.
  temporal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SMELTERY_TEST_TEMPORAL_LOCAL: "1"
      SMELTERY_TEST_TEMPORAL_REQUIRE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install (dev + temporal + attestation extras, ferric from PyPI)
        run: uv sync --extra dev --extra temporal --extra attestation --no-sources

      - name: Temporal workflow tests (against a dev server this job starts)
        run: >
          uv run --no-sync pytest -q -rs -p no:randomly
          tests/test_temporal_campaign.py tests/test_temporal_run.py tests/test_job_backends.py

  # The ml-potential tests need torch, so the `test` job skips them. This job installs the extra (CPU torch, which
  # keeps the download small) and fails if any of them still skips for a missing module (issue #22).
  ml-potential:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_TORCH_BACKEND: cpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install (dev + ml-potential extras, ferric from PyPI)
        run: uv sync --extra dev --extra ml-potential --no-sources

      - name: ML potential tests (real ANI-2x)
        run: |
          set -o pipefail
          uv run --no-sync pytest -q -rs tests/test_ml_potential.py tests/test_torchani_potential.py | tee /tmp/ml.txt
          if grep -iE '^SKIPPED.*(ml-potential|openmm|torch)' /tmp/ml.txt; then
            echo "::error::an ml-potential test skipped for a missing module; the job install is not effective"
            exit 1
          fi

  # The BUILT wheel installed with plain pip into a fresh venv, with and without each extra the wheel declares
  # (issue #31). The matrix comes from the wheel's own metadata, so a new extra is covered the moment it exists;
  # scripts/wheel_smoke.py refuses an extra it has no checks for, and tests/test_wheel_smoke.py guards the same.
  wheel-build:
    runs-on: ubuntu-24.04
    outputs:
      extras: ${{ steps.extras.outputs.extras }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # hatch-vcs derives the version from tags
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the Bench UI (shipped in the wheel; src/smeltery/bench/web is gitignored build output)
        run: |
          npm ci --prefix ui
          npm run build --prefix ui
      # Plain `python -m build`, the SAME command release.yml runs, not `--wheel`: it builds the sdist first and the
      # wheel FROM that sdist, so an artifact the sdist drops is missing from the wheel. Building only the wheel here
      # meant that difference went untested until a tag, and v0.1.0 published nothing because of it (the sdist had 0
      # of the 59 bench/web files). Keep these two commands identical so the release path is exercised on every PR.
      - name: Build the sdist and the wheel (the release path)
        run: |
          python -m pip install --upgrade build
          python -m build
      - id: extras
        run: echo "extras=$(python scripts/wheel_smoke.py list-extras dist/*.whl)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel
          path: dist/
          if-no-files-found: error

  wheel-smoke:
    needs: wheel-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        extra: ${{ fromJSON(needs.wheel-build.outputs.extras) }}
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel
          path: dist/
      - name: Wheel with extra "${{ matrix.extra }}"
        run: python scripts/wheel_smoke.py check dist/*.whl --extra "${{ matrix.extra }}" --config examples/mwe_benzoic.toml
      - name: The example runs from the installed wheel, and the run record's ferric provenance is VERIFIED
        if: matrix.extra == 'none'
        run: python scripts/wheel_smoke.py check dist/*.whl --extra none --example examples/mwe_benzoic.py

  # The PoseBusters gate on Python 3.12 (issue #68). The `test` job runs 3.11
  # only, which hid a segfault in posebusters_check on uv's CPython 3.12.11+
  # (numpy iterating RDKit Point3D -> C++ throw -> boost stacktrace hook ->
  # _Unwind_Backtrace). gates.py works around it; this job fails if that
  # regresses. Not continue-on-error: the workaround is verified.
  posebusters-py312:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install (dev + posebusters extras, ferric from PyPI)
        run: uv sync --extra dev --extra posebusters --no-sources

      - name: PoseBusters tests on 3.12
        run: uv run --no-sync pytest -q tests/test_posebusters_gate.py

  # The Docker image serves the demo (issue B08). Builds the image (which builds the UI itself: src/smeltery/bench/web
  # is gitignored), runs it with a known token, waits for the container's own healthcheck, then asserts that /readyz
  # is 200 and /api/runs is non-empty, which only holds if the pip install, the prebuilt pipelines and --demo all
  # worked. Also asserts that an unauthenticated /api/runs is refused (the token is enforced off loopback).
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOKEN: ci-docker-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build --tag smeltery-bench:ci .
      - name: Run it (the demo)
        run: >
          docker run --detach --name bench --publish 127.0.0.1:8765:8765
          --env SMELTERY_BENCH_TOKEN="$TOKEN" smeltery-bench:ci
      - name: Wait for the healthcheck
        run: |
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' bench)"
            [ "$status" = healthy ] && exit 0
            [ "$(docker inspect --format '{{.State.Running}}' bench)" = true ] || break
            sleep 2
          done
          echo "::error::the container never became healthy (last status: $status)"
          exit 1
      - name: /readyz is 200 and /api/runs is non-empty
        run: |
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8765/readyz
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8765/api/runs)"
          [ "$code" = 401 ] || { echo "::error::/api/runs without the token returned $code, expected 401"; exit 1; }
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8765/api/runs > runs.json
          python3 - <<'PY'
          import json
          runs = json.load(open("runs.json"))
          runs = runs.get("runs", runs) if isinstance(runs, dict) else runs
          assert runs, "/api/runs is empty: the demo was not seeded"
          print(len(runs), "runs")
          PY
      - name: Container logs
        if: always()
        run: docker logs bench || true

  # Roadmap 27: an agent transcript as CI (tests/cross_server/test_agent_transcript.py, docs/cross-server.md). Two MCP
  # servers over stdio, as an agent drives them: smeltery's on the fake engine submits and polls two screens, then
  # attestation's `attest-mcp` reports what is in flight, scans the run directories, ranks the campaign and reads each
  # run's provenance from the core record smeltery wrote. The `test` job has no `mcp` extra and no attest-mcp, so the
  # test skips there; here SMELTERY_REQUIRE_CROSS_SERVER=1 turns a skip into a failure.
  #
  # attestation is installed with `uv tool install` into ITS OWN environment (its own Python, >= 3.12), never into
  # smeltery's: smeltery must not import attestation, and the only thing the two share is the run directory. It comes
  # from git, not PyPI, because PyPI's attestation 0.5.0 predates both pieces this test talks to (the ledger's
  # core-record reader and runs.status), and attestation main needs attestation-schema >= 0.2.0, which PyPI does not
  # have yet (0.1.0): a git install builds it from the same checkout. Tracking main is deliberate -- this job is the
  # check that the two repositories' heads still fit -- and ATTESTATION_REF can pin a tag once one is released.
  cross-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ATTESTATION_REF: main
      SMELTERY_REQUIRE_CROSS_SERVER: "1"
      SMELTERY_CROSS_SERVER_TRANSCRIPT: ${{ github.workspace }}/cross-server/transcript.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install smeltery (dev + mcp + attestation extras, ferric from PyPI)
        run: uv sync --extra dev --extra mcp --extra attestation --no-sources

      - name: Install attestation in its own tool environment
        run: uv tool install --python 3.12 "git+https://github.com/mgoldey/attestation@${ATTESTATION_REF}"

      - name: Check the two stay apart (attest-mcp on PATH, attestation not importable from smeltery's env)
        run: |
          command -v attest-mcp
          uv run --no-sync python -c "import importlib.util as u; assert u.find_spec('attestation') is None"

      - name: Cross-server transcript
        run: uv run --no-sync pytest -q -rs -p no:randomly tests/cross_server

      - name: Upload the transcript
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-server-transcript
          path: cross-server/
          if-no-files-found: warn

  # Roadmap 46: the pinned compatible set (compat/stack.toml, docs/compatibility.md#the-pinned-stack) installed the way
  # a user installs it -- smeltery with compat/constraints.txt into a fresh venv (NOT `uv sync`, which would read
  # uv.lock instead), attestation at the stack's pinned commit in its own tool environment -- and the cross-server
  # transcript run against exactly that pair. The `cross-server` job above tracks attestation main; this one proves
  # the pin. tests/test_compat_stack.py keeps the smeltery-environment pins equal to uv.lock's.
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SMELTERY_REQUIRE_CROSS_SERVER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: compat/constraints.txt is generated from compat/stack.toml
        run: uv run --no-project --with packaging python scripts/compat_matrix.py constraints --check
      - name: smeltery with the pinned constraints, in a fresh venv
        run: |
          uv venv /tmp/stack --python 3.12
          uv pip install --python /tmp/stack/bin/python -c compat/constraints.txt ".[mcp,attestation]" pytest
          /tmp/stack/bin/python - <<'PY'
          import tomllib, importlib.metadata as m
          pins = tomllib.load(open("compat/stack.toml", "rb"))["smeltery-env"]["pins"]
          got = {n: m.version(n) for n in pins}
          assert got == {n: p["version"] for n, p in pins.items()}, got
          print(got)
          PY
      - name: attestation at the pinned commit, in its own tool environment
        run: |
          rev="$(python3 -c "import tomllib; print(tomllib.load(open('compat/stack.toml','rb'))['attestation-env']['attestation']['rev'])")"
          uv tool install --python 3.12 "git+https://github.com/mgoldey/attestation@${rev}"
          command -v attest-mcp
      - name: Cross-server transcript against the pinned pair
        run: |
          mkdir /tmp/run && cp -r tests /tmp/run/tests && cd /tmp/run
          PATH="/tmp/stack/bin:$PATH" /tmp/stack/bin/python -m pytest -q -rs -p no:cacheprovider tests/cross_server
