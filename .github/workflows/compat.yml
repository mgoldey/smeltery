# Roadmap 46: which ferric versions this smeltery works with (docs/compatibility.md,
# docs/superpowers/specs/2026-11-20-compat-matrix-design.md).
#
# One cell per ferric: a fresh venv with this smeltery, that ferric and every other dependency pinned to uv.lock,
# then the engine-calling tests and the example (scripts/compat_matrix.py). The ferric list is every PyPI release
# smeltery's declared floor admits, plus ferric `main` as its newest nightly wheel (ferric's wheels.yml builds one
# daily and keeps it 3 days): building ferric here would need libint2, which the runner does not have. If no nightly
# wheel can be downloaded, the `main` cell says so (not installable) instead of disappearing.
#
# It does not run on every PR: each cell is minutes, and the `test` job already proves the locked ferric. It runs
# weekly (so a new ferric release or a moved ferric main shows up without a smeltery change), on demand, and on
# every `v*` tag (the release's own row). It NEVER commits: no workflow in this repository pushes to main, and a
# bot commit would bypass the review every other change gets. The regenerated docs/compatibility.md and the raw
# cells are the `compatibility` artifact; refreshing the committed copy is `render --write` on those cells in a PR.
#
# Actions are pinned by commit SHA, the same pins as test.yml.
name: compat

on:
  schedule:
    - cron: "41 5 * * 1"   # Mondays 05:41 UTC
  workflow_dispatch:
    inputs:
      ferric:
        description: "Extra ferric specs, space-separated (PyPI versions, e.g. 0.1.0rc8 to test below the floor)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      ferric: ${{ steps.list.outputs.ferric }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.11"
      - id: list
        env:
          EXTRA: ${{ github.event.inputs.ferric }}
        run: |
          args=(--include main)
          for spec in $EXTRA; do args+=(--include "$spec"); done
          echo "ferric=$(uv run --no-project --with packaging python scripts/compat_matrix.py list-ferric "${args[@]}")" >> "$GITHUB_OUTPUT"

  cell:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ferric: ${{ fromJSON(needs.plan.outputs.ferric) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # hatch-vcs derives smeltery's version from tags: the row's name
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: ferric main's newest nightly wheel
        if: matrix.ferric == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          spec="main=git+https://github.com/mgoldey/ferric@main"   # fallback: not installable here (no libint2)
          id="$(gh run list -R mgoldey/ferric --workflow wheels.yml --branch main --status success --limit 1 \
                --json databaseId --jq '.[0].databaseId' || true)"
          if [ -n "$id" ] && gh run download "$id" -R mgoldey/ferric -n wheels-cp310-abi3 -D ferric-main; then
            spec="main=$(ls ferric-main/ferric-*.whl | head -n1)"
          else
            echo "::warning::no ferric nightly wheel could be downloaded; the main cell will say not installable"
          fi
          echo "FERRIC_SPEC=$spec" >> "$GITHUB_ENV"
      - name: Cell
        env:
          SPEC: ${{ matrix.ferric }}
        run: |
          spec="${FERRIC_SPEC:-$SPEC}"
          uv run --no-project --with packaging python scripts/compat_matrix.py run --ferric "$spec" --out cells \
            || echo "::warning::smeltery x ferric $SPEC did not pass (see the cell)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cell-${{ strategy.job-index }}
          path: cells/
          if-no-files-found: error

  table:
    needs: cell
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cell-*
          path: cells/
          merge-multiple: true
      # Merged into the committed doc's data, so the artifact is the whole history plus this run. Fails (after
      # writing) if a ferric the floor admits did not pass: that is a compatibility break, not a table entry.
      - name: Regenerate docs/compatibility.md
        run: |
          set -o pipefail
          uv run --no-project --with packaging python scripts/compat_matrix.py render cells/*.json --write \
            --fail-on-supported-failure 2>&1 | tee render.log
      - name: Summary
        if: always()
        run: sed -n '/^## Matrix/,/^## Cells/p' docs/compatibility.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compatibility
          path: |
            docs/compatibility.md
            cells/
