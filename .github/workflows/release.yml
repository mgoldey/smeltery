# Publish to PyPI on a version tag, via Trusted Publishing (OIDC): no stored token.
#
# PyPI side: a trusted publisher for owner=mgoldey, repo=smeltery,
# workflow=release.yml, environment=pypi.
#
# Nothing is published unless:
#   1. the tree is clean and the built sdist/wheel version equals the tag
#      (the version is DERIVED from the tag by hatch-vcs; no version commit),
#   2. the sdist and wheel pass `twine check --strict`,
#   3. the BUILT WHEEL, installed with plain pip and with ferric resolved from
#      PyPI (as a user would get it), passes the test suite and runs the example;
#      and installs and imports with each extra it declares (--full: the heavy
#      extras installed for real), the example's run record reporting a VERIFIED
#      ferric provenance from the package index.
#
# 1-3 are the `build` job, which calls the reusable wheel-smoke workflow shared with attestation (roadmap 39;
# attestation docs/superpowers/specs/2026-11-20-shared-ci-templates-design.md), pinned by the same full commit SHA
# as test.yml (tests/test_shared_workflows.py). It builds once, checks 1 and 2, uploads `dist`, then runs one smoke
# job per extra the wheel declares (3; the "none" cell also runs the tests and the example). Its checks read
# `build / build` and `build / smoke (py3.11, <extra>)`. `publish` stays a top-level job here: PyPI trusted
# publishing does not work from a reusable workflow, and the publisher above names THIS file. `needs: build` waits
# for every called job, so nothing is published unless every smoke cell passed.
#
# Actions are pinned by commit SHA, the same pins ferric uses.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: mgoldey/attestation/.github/workflows/reusable-wheel-smoke.yml@b1c5cb2f93b43d0b2441f40c323a4c7741ebc5a9 # attestation main 2026-11-20 (PR #70)
    with:
      runs-on: ubuntu-24.04
      build-python-version: "3.11"
      fetch-depth: 0   # hatch-vcs needs the full history and tags
      require-clean-tree: true
      tag-prefix: v   # version-file empty: hatch-vcs derives the version from the tag
      node-version: "22"
      node-cache-dependency-path: ui/package-lock.json
      # The Bench UI ships in the wheel; src/smeltery/bench/web is gitignored build output.
      pre-build: npm ci --prefix ui && npm run build --prefix ui
      build-command: python -m pip install --upgrade build && python -m build
      twine-check: true
      artifact-name: dist
      matrix-command: python scripts/wheel_smoke.py list-extras dist/*.whl
      smoke-python-versions: '["3.11"]'
      # The "none" cell also tests the built wheel against ferric from PyPI, from a copy of the tests so they import
      # the INSTALLED package, not ./src.
      smoke-command: |
        export OPENBLAS_NUM_THREADS=1
        python scripts/wheel_smoke.py check dist/*.whl --extra "$SMOKE_CELL" --config examples/mwe_benzoic.toml --full
        if [ "$SMOKE_CELL" = none ]; then
          python scripts/wheel_smoke.py check dist/*.whl --extra none --example examples/mwe_benzoic.py
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install dist/*.whl pytest
          /tmp/venv/bin/pip show ferric | grep -E '^(Name|Version)'
          mkdir /tmp/t && cp tests/*.py examples/mwe_benzoic.py /tmp/t/
          cd /tmp/t
          /tmp/venv/bin/python -m pytest -q -p no:cacheprovider test_funnel.py test_anchors.py
          /tmp/venv/bin/python mwe_benzoic.py
        fi

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/smeltery/
    permissions:
      id-token: write   # OIDC token for Trusted Publishing; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
