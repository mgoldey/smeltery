# Publish to PyPI on a version tag, via Trusted Publishing (OIDC): no stored token.
#
# PyPI side: a trusted publisher for owner=mgoldey, repo=smeltery,
# workflow=release.yml, environment=pypi.
#
# Nothing is published unless:
#   1. the tree is clean and the built sdist/wheel version equals the tag
#      (the version is DERIVED from the tag by hatch-vcs; no version commit),
#   2. the sdist and wheel pass `twine check`,
#   3. the BUILT WHEEL, installed with plain pip and with ferric resolved from
#      PyPI (as a user would get it), passes the test suite and runs the example.
#
# Actions are pinned by commit SHA, the same pins ferric uses.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # hatch-vcs needs the full history and tags

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Tree must be clean
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git status --porcelain --untracked-files=no
            echo "::error::working tree is dirty at build time; refusing to release"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Built version must equal the tag (no local segment)
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in dist/*.whl dist/*.tar.gz; do
            base=$(basename "$f")
            ver=$(echo "$base" | sed -E 's/^smeltery-([^-]+)(-.*|\.tar\.gz)$/\1/')
            echo "$base -> version $ver (tag $tag)"
            case "$ver" in *+*) echo "::error::$base has a local version segment"; exit 1;; esac
            test "$ver" = "$tag" || { echo "::error::$base version $ver != tag $tag"; exit 1; }
          done

      - name: Test the built wheel against ferric from PyPI
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install dist/*.whl pytest
          /tmp/venv/bin/pip show ferric | grep -E '^(Name|Version)'
          # Run from a copy, so the tests import the INSTALLED package, not ./src.
          mkdir /tmp/t && cp tests/*.py examples/mwe_benzoic.py /tmp/t/
          cd /tmp/t
          /tmp/venv/bin/python -m pytest -q -p no:cacheprovider test_funnel.py test_anchors.py
          /tmp/venv/bin/python mwe_benzoic.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/smeltery/
    permissions:
      id-token: write   # OIDC token for Trusted Publishing; nothing else
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
